# Randomized pairwise gossip (Boyd et al. 2006) on a ring. Each agent's
# clock ticks as a Poisson process (rate 1 per time unit); on a tick it
# averages with one random neighbor via a pull/push exchange. Latency is
# kept far below the clock period so exchanges rarely overlap.
schema_version: "1.0"

experiment:
  name: "async_gossip_ring"
  seed: 11

simulation:
  num_agents: 30
  max_virtual_time: 400
  tick_interval: 1           # metric sampling only
  activation: event

plugins:
  behavior: "simul8.plugins.behaviors.async_gossip.AsyncGossipBehavior"
  communication: "simul8.plugins.communication.latency.LatencyProtocol"
  topology: "simul8.plugins.topologies.ring.RingTopology"
  metrics:
    - "simul8.plugins.metrics.convergence.ConvergenceMetric"
    - "simul8.plugins.metrics.message_count.MessageCountMetric"
  persistence:
    - "simul8.plugins.persistence.csv_exporter.CsvExporter"

plugin_configs:
  AsyncGossipBehavior:
    clock_rate: 1.0
    initial_value_range: [0.0, 1.0]
  LatencyProtocol:
    distribution: constant
    delay: 0.01

schema_version: "1.0"

experiment:
  name: "leader_random"
  seed: 12345

simulation:
  num_agents: 50
  max_virtual_time: 40
  tick_interval: 1

plugins:
  behavior: "samesim.plugins.behaviors.leader_election.LeaderElectionBehavior"
  communication: "samesim.plugins.communication.gossip.GossipProtocol"
  topology: "samesim.plugins.topologies.random_graph.ErdosRenyiTopology"
  metrics:
    - "samesim.plugins.metrics.message_count.MessageCountMetric"
    - "samesim.plugins.metrics.leader_metrics.LeaderConsensusMetric"
    - "samesim.plugins.metrics.state_trace.TopologyMetric"
    - "samesim.plugins.metrics.state_trace.StateTraceMetric"
  persistence:
    - "samesim.plugins.persistence.csv_exporter.CsvExporter"

plugin_configs:
  LeaderElectionBehavior: {}
  ErdosRenyiTopology:
    edge_probability: 0.12

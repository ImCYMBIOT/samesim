# Push-gossip averaging: 1,000 agents on an Erdos-Renyi graph, each averaging
# with what it receives and pushing to 3 random neighbors per tick.
schema_version: "1.0"

experiment:
  name: "gossip_convergence_1000"
  seed: 421

simulation:
  num_agents: 1000
  # Converges (variance ~1e-6) in well under 60 ticks at this size.
  max_virtual_time: 60
  tick_interval: 1

plugins:
  behavior: "samesim.plugins.behaviors.gossip_behavior.GossipBehavior"
  communication: "samesim.plugins.communication.gossip.GossipProtocol"
  topology: "samesim.plugins.topologies.random_graph.ErdosRenyiTopology"
  metrics:
    - "samesim.plugins.metrics.message_count.MessageCountMetric"
    - "samesim.plugins.metrics.convergence.ConvergenceMetric"
    - "samesim.plugins.metrics.trace_digest.TraceDigestMetric"
  persistence:
    - "samesim.plugins.persistence.csv_exporter.CsvExporter"

plugin_configs:
  GossipBehavior:
    initial_value_range: [0.0, 1.0]
    fan_out: 3
  ErdosRenyiTopology:
    # p=0.01 gives ~10 expected neighbors for N=1000.
    # Above the connectivity threshold ln(1000)/1000 ≈ 0.0069.
    edge_probability: 0.01

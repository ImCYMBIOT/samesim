# Push-gossip averaging on an Erdos-Renyi random graph (100 agents).
schema_version: "1.0"

experiment:
  name: "gossip_random"
  seed: 42

simulation:
  num_agents: 100
  max_virtual_time: 100
  tick_interval: 1

plugins:
  behavior: "samesim.plugins.behaviors.gossip_behavior.GossipBehavior"
  communication: "samesim.plugins.communication.gossip.GossipProtocol"
  topology: "samesim.plugins.topologies.random_graph.ErdosRenyiTopology"
  metrics:
    - "samesim.plugins.metrics.message_count.MessageCountMetric"
    - "samesim.plugins.metrics.convergence.ConvergenceMetric"
    - "samesim.plugins.metrics.state_trace.TopologyMetric"
    - "samesim.plugins.metrics.state_trace.StateTraceMetric"
    - "samesim.plugins.metrics.trace_digest.TraceDigestMetric"
  persistence:
    - "samesim.plugins.persistence.csv_exporter.CsvExporter"

plugin_configs:
  GossipBehavior:
    initial_value_range: [0.0, 1.0]
    fan_out: 2
  ErdosRenyiTopology:
    edge_probability: 0.08

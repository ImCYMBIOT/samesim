name: tests

on:
  push:
  pull_request:

jobs:
  # Required. Every supported Python version must pass the full suite,
  # including the golden traces -- the same seed must produce the same run
  # on every version pyproject.toml claims to support. (Before math.fsum,
  # every gossip run differed between 3.11 and 3.12.)
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # Required. Golden traces are recorded on Linux and must reproduce
  # bit-for-bit on macOS and Windows. Two topology generators use math.log,
  # whose last ulp can in principle differ between C libraries; a failure
  # here is a real cross-platform reproducibility finding, not flakiness.
  # (Informational until the first run, 2026-09-24, which passed.)
  cross-os-determinism:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/regression/test_golden_traces.py

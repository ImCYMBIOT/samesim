name: draft-pdf

# Builds the JOSS paper (paper/paper.md) into a PDF with the Open Journals
# toolchain and attaches it to the run as an artifact. Runs only when the
# paper changes; paper/ is not committed yet, so until it is, this never runs.
on:
  push:
    paths:
      - "paper/**"

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
